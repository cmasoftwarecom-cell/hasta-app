name: mobile
description: Hasta mobile bootstrap.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  crypto: 3.0.6
  dio: 5.7.0
  drift: 2.20.3
  flutter_secure_storage: 9.2.4
  path_provider: 2.1.5
  sqlite3_flutter_libs: 0.5.28

dev_dependencies:
  flutter_lints: 4.0.0
  build_runner: 2.4.13
  drift_dev: 2.20.3
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMyanmar-SemiBold.ttf
          weight: 600
