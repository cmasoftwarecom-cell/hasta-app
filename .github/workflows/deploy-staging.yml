name: deploy-staging
# Fixes "GitHub deployment records list only GitHub Pages": this job registers a
# `staging` environment deployment and records the deployed commit SHA.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy (must be a merged, reviewed revision)
        required: true
        default: main

permissions:
  contents: read
  deployments: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: staging                 # create in repo Settings > Environments, with required reviewers
      url: https://api-staging.hasta.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: deployment-source
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revision
        id: sha
        run: |
          sha="$(git -C deployment-source rev-parse HEAD)"
          git -C deployment-source merge-base --is-ancestor "$sha" origin/main || {
            echo 'Deployment revision must already be merged into main.' >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build image with baked GIT_COMMIT
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          bash tools/scripts/deploy-staging.sh build "$DEPLOY_SHA" deployment-source "$RUNNER_TEMP/api.tar.gz"

      - name: Check health verifier tools
        run: |
          test -r docs/repo-ready/verify-staging.sh
          if ! command -v dig >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y dnsutils
          fi
          command -v dig && command -v jq && command -v curl

      - name: Transfer, verify and commit staging release
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          bash tools/scripts/deploy-staging.sh ship "$DEPLOY_SHA" "$RUNNER_TEMP/api.tar.gz" https://api-staging.hasta.app
