name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hasta_test
          POSTGRES_USER: hasta
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hasta -d hasta_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HASTA_DATABASE_URL: postgresql://hasta@127.0.0.1:5432/hasta_test
      HASTA_ENV: test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde9109e29acf3be36a7f410e183  # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - working-directory: apps/server
        run: |
          npm ci
          npm run build
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$HASTA_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          npm run test:smoke
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde9109e29acf3be36a7f410e183  # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - run: |
          npm --prefix apps/server ci
          npm --prefix apps/server run build
          node tools/scripts/static-gates.mjs
          node tools/scripts/design-tokens.mjs --check
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@08c6903cd8c0fde9109e29acf3be36a7f410e183  # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@dd5c4800f135b0217c8a9c6ab5846b885d26538d  # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd25e0c96157de28ffd3886a87df32189bd99dff  # v2.18.0
        with:
          flutter-version: '3.24.5'
          cache: true
      - run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - run: flutter build apk --release --no-pub
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@08c6903cd8c0fde9109e29acf3be36a7f410e183  # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - uses: subosito/flutter-action@fd25e0c96157de28ffd3886a87df32189bd99dff  # v2.18.0
        with:
          flutter-version: '3.24.5'
          cache: true
      - run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@08c6903cd8c0fde9109e29acf3be36a7f410e183  # v5.0.1
      - name: Install pinned Terraform
        run: |
          set -euo pipefail
          ZIP="terraform_1.9.8_linux_amd64.zip"
          BASE="https://releases.hashicorp.com/terraform/1.9.8"
          curl -fsSLo "/tmp/${ZIP}" "${BASE}/${ZIP}"
          curl -fsSLo /tmp/SHA256SUMS "${BASE}/terraform_1.9.8_SHA256SUMS"
          grep "  ${ZIP}\$" /tmp/SHA256SUMS | sha256sum -c -
          unzip -o -q "/tmp/${ZIP}" -d /usr/local/bin
          terraform version
      - run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
